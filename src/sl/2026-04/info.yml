---
  title: "Dar preroštva"
  description: "Nevroznanstveniki šele začenjajo razumevati osupljivo sposobnost dojenčkov za učenje jezika. Pri starosti šest mesecev dojenček lahko razume glasove, ki tvorijo besede njegove materinščine. Če je izpostavljen drugemu jeziku, se lahko nauči tudi tega. V tem obdobju se odprejo skrivnostna vrata uma, ki malčku omogočajo razlikovati med približno 40 zvoki, ki običajno tvorijo materni jezik, in približno 800 različnimi zvoki, ki jih zaznajo ob rojstvu. Vendar obstaja en pogoj: z dojenčki je treba govoriti. To bi lahko imenovali »zvočni pouk za novorojenčke«."

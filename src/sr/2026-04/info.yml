---
  title: "Dar proroštva"
  description: "Neuronaučnici su počeli da razumeju čudesnu sposobnost ljudskih beba za usvajanje jezika. Sa šest meseci, beba može da razume glasove koji čine engleske reči ili reči iz bilo kog od preko 7.000 govornih jezika. Ako je izložena drugom jeziku, može da usvoji i taj jezik. Tokom ovog perioda otvaraju se misteriozna mentalna vrata, omogućavajući bebama da razlikuju četrdesetak glasova koji generalno čine maternji jezik od 800 različitih zvukova koje mogu da percipiraju pri rođenju. Ali postoji jedna začkoljica: bebama se mora govoriti. Mogli biste to nazvati časovima glasa za novorođenčad."

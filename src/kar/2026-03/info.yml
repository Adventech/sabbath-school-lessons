---
  title: "၁ က၇ံၣ်သူး ဒီး ၂ က၇ံၣ်သူး"
  description: "တၢ်ကွဲးလံၥ်တဖၣ်န့ၣ် တမ့ၢ်တၢ်လၢအလီၢ်လံၤကွံၥ်ဝဲသ့ဒီး ဘၣ်တၢ် သးပ့ၤနီၣ်ကွံၥ်ဝဲသ့တမံၤဘၣ်. ပဆီတလဲသးတသ့ဝဲဘၣ် ဒ်လံၥ်လၢတၢ်ကွဲး အီၤအဂ့ၢ်အကျိၤအံၤအသိးန့ၣ်လီၤ. မ့ၢ်မးလီၤ, တၢ်၇ၤလီၤတၢ်၇့လိၥ်မုၥ်လိၥ် သးအတၢ်ကစီၣ်ဟံးန့ၢ်တၢ်လီၢ်အံၤန့ၣ်လီၤ. မ့ၢ်နၥ်သက့ဒ်န့ၣ်ဒီး, လၢတၢ် အကံၢ်အလဲဂီၢ်နီၢ်ကီၢ်န့ၣ်, emails ဒီးလံၥ်လၢအဘၣ်တၢ်ဆှၢအီၤခီဖျိလီကျိၤ တဖၣ်န့ၣ် အိၣ်ဒီးအတၢ်သ့တၢ်ဘၣ်, အတၢ်မၤတမံၤဃီစ့ၢ်ကီး-အဝဲသ့ၣ် ဒုးဆဲးကျိးၦၤဂီၢ်မုၢ်ဒ်သိးကနီၤလီၤတၢ်ဂ့ၢ်တၢ်ကျိၤ, သးအတၢ်တူၢ်ဘၣ်ခီၣ်ဘၣ် ဒီးတၢ်ဆိကမိၣ်သ့ၣ်တဖၣ်န့ၣ်လီၤ."

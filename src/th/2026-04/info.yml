---
  title: "ของประทานการเผยพระวจนะ"
  description: "นักประสาทวิทยาเริ่มเข้าใจความสามารถอันน่าทึ่งของทารกในการเรียนรู้ภาษา เมื่ออายุได้หกเดือน ทารกสามารถเข้าใจเสียงที่ประกอบเป็นคำในภาษาอังกฤษ หรือคำจากภาษาพูดอื่น ๆ อีกกว่า 7,000 ภาษา และหากได้สัมผัสกับภาษาที่สอง ทารกก็สามารถเรียนรู้ภาษานั้นได้เช่นกัน ในช่วงเวลานี้ ประตูลึกลับในจิตใจจะเปิดออก ช่วยให้ทารกแยกแยะเสียงประมาณ 40 เสียงที่ประกอบกันเป็นภาษาแม่ ออกจากเสียงที่แตกต่างกันถึง 800 เสียงที่พวกเขารับรู้ได้ตั้งแต่แรกเกิด แต่มีเงื่อนไขอยู่หนึ่งอย่าง คือต้องมีคนพูดกับทารก เราอาจเรียกสิ่งนี้ว่าบทเรียนการฟังเสียงสำหรับทารกแรกเกิด"

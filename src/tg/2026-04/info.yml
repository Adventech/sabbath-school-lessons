  title: "Атои нубувват"
  description: "Нейробиологҳо танҳо акнун тадриҷан қобилияти ҳайратангези кӯдакони навзодро барои аз худ кардани забон меомӯзанд. Ҳанӯз дар синни шашмоҳагӣ кӯдак метавонад овозҳои забони модарии худро, инчунин овозҳои зиёда аз ҳафт ҳазор забони ҷаҳонро фарқ кунад. Агар дар муҳити ӯ забони дуюм низ шунида шавад, кӯдак онро ҳам тадриҷан меомӯзад. Дар ҳамин давра гӯё дар шуури ӯ даре кушода мешавад: аз тақрибан ҳаштсад навъи овозе, ки аз рӯзи таваллуд шунида метавонад, вай тақрибан чиҳил овозеро ҷудо мекунад, ки асоси забони модарии ӯро ташкил медиҳанд. Аммо барои ин як шарт лозим аст: бо кӯдак бояд суҳбат кард. Инро метавон дарсҳои суханронӣ барои навзодон номид."

---
  title: "Ang Dolot Sang Pagpanagna"
  description: "Ang mga neuroscientist nagasugod palang sa paghangup sang makatilingala nga ikasarang sang tawohanon nga mga lapsag sa pagtoon sa paghambal. Sa anum ka bulan, ang lapsag makahangup na sang mga tunog sang mga tinaga sa Ingles, ukon mga tinaga halin sa sobra 7,000 ka iban pa nga lengguahe. Kon mapadayag sa ikaduha nga lengguahe, ila man maton-an ang ina nga lengguahe. Sa sini nga tion, ang makatalanhaga nga ganhaan sang hunahuna nagabukas, nga nagatugut sa mga lapsag nga makilala ang kap-atan ukon kapin pa nga tunog nga sa kabilogan nagahuman sang tumandok nga lengguahe halin sa 800 ka nagkalainlain nga tunog nga ila mahangpan sa pagkabun-ag. Apang may kondisyon: dapat hambalon sila. Matawag mo ini nga mga leksyon sa paghambal para sa mga bag-ong bun-ag."

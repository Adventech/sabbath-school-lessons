  description: "Ang pagsulat sang mga sulat madugay na nga hilikuton nga wala nagadaan. Ginabag-o lang naton ang paagi sang pagsulat sining mga sulat. Hoo, ginbuslan sang social media ang papel. Apang, sa importansia, ang mga email kag iban pa nga porma sang elektronik nga mga sulat my pareho nga epekto: ginaangot sini ang mga tawo paagi sa pagbayluhanay sang impormasyon, mga balatyagon, kag mga panghunahuna."

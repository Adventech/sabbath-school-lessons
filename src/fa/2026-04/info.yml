---
  title: "عطیه نبوت"
  description: "به تازگی، دانشمندان مغز و اعصاب، توانایی شگفتانگیز نوزادان در یادگیری زبان را بهتر تشخیص داده اند. نوزاد ششماهه میتواند صداهایی را که واژههای زبان انگلیسی و یا هر یک از بیش از هفتهزار زبان دنیا را میسازند، تشخیص دهد. اگر کودک در این سن در معرض زبان دومی هم قرار بگیرد، میتواند آن را نیز یاد بگیرد. در این زمان، انگار دریچهای در ذهن نوزاد باز میشود که به او کمک میکند حدود چهل صدایی را که عموماً یک زبان مادری را تشکیل میدهند، از ۸۰۰ صدای مختلفی که میتواند از زمان تولد بشنود، تشخیص دهد."

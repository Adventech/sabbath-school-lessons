  title: "ଭବିଷ୍ୟଦ୍ ବାଣୀର ଦାନ"
  description: "ମଣିଷର ଛୋଟ ଶିଶୁମାନେ ଭାଷା ଶିଖିବାର ଯେଉଁ ଅଦ୍ଭୁତ କ୍ଷମତା ରଖନ୍ତି, ବୈଜ୍ଞାନିକମାନେ ଏବେ ତାହାକୁ ଭଲଭାବରେ ବୁଝିବାକୁ ଲାଗିଛନ୍ତି। ଏକ ଶିଶୁ ମାତ୍ର ଛଅ ମାସ ବୟସରେ ଇଂରାଜୀ କିମ୍ବା ପୃଥିବୀର ୭,୦୦୦ରୁ ଅଧିକ ଭାଷାର ଧ୍ୱନିକୁ ଚିହ୍ନିପାରେ। ଯଦି ସେ ଦୁଇଟି ଭାଷା ଶୁଣି ବଡ଼ ହୁଏ, ତେବେ ସେ ଦୁଇଟି ଭାଷା ମଧ୍ୟ ଶିଖିପାରେ। ଏହି ସମୟରେ ତାଙ୍କ ମସ୍ତିଷ୍କରେ ଏକ ବିଶେଷ ବିକାଶ ହୁଏ। ଜନ୍ମ ସମୟରେ ସେ ପ୍ରାୟ ୮୦୦ ପ୍ରକାରର ଧ୍ୱନି ଚିହ୍ନିପାରୁଥିଲେ ମଧ୍ୟ, ପରେ ନିଜ ମାତୃଭାଷାର ପ୍ରାୟ ୪୦ଟି ଧ୍ୱନିକୁ ସ୍ପଷ୍ଟ ଭାବରେ ବୁଝିବାକୁ ଶିଖିଯାଏ। କିନ୍ତୁ ଏଥିପାଇଁ ଗୋଟିଏ ଜରୁରୀ କଥା ଅଛି—ଶିଶୁ ସହିତ କଥା ହେବାକୁ ପଡ଼େ। ଏହାକୁ ନବଜାତ ଶିଶୁର ଭାଷା ଶିକ୍ଷା ବୋଲି କୁହାଯାଇପାରେ।"

---
  title: "Մարգարեական Պարգեվը"
  description: "Նյարդաբանները սկսել են հասկանալ մարդկանց նորածինների լեզվի ձեռքբերման հրաշալի ունակությունը: Վեց ամսականում երեխան կարող է հասկանալ այն հնչյունները, որոնք կազմում են անգլերեն բառերը կամ ավելի քան 7,000 խոսակցական լեզուներից որևէ մեկի բառերը: Եթե նրանք առնչվեն երկրորդ լեզվի հետ, կարող են յուրացնել նաև այդ լեզուն: Այս ընթացքում բացվում է մի խորհրդավոր մտավոր դուռ, որը նորածիններին թույլ է տալիս տարբերակել մայրենի լեզուն կազմող մոտ 40 հնչյուններ` 800 տարբեր հնչյուններից, որոնք նրանք կարող են ընկալել ծննդյան ժամանակ: Սակայն կա մի պայման. մանկիկների հետ պետք է խոսել: Սա կարելի է անվանել ձայնային դասեր նորածինների համար:"

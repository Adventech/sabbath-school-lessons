  title: "Պողոս առաքյալի առաջին եվ երկրորդ ուղերձները Կորնթացիներին"
  description: "Նամակ գրելը հին, դարերից եկող զբաղմունք է, որը դեռևս չի հնացել։ Մենք պարզապես փոխել ենք նամակներ գրելու ձևը։ Այո՛, սոցիալական մեդիան փոխարինել է թղթին։ Սակայն իրենց էությամբ էլեկտրոնային նամակները և հաղորդակցության մյուս թվային ձևերը կատարում են գրեթե նույն գործառույթը․ դրանք կապում են մարդկանց` տեղեկատվություն, զգացումներ և մտքեր փոխանակելու միջոցով։"

---
  title: "Karama Ya Unabii"
  description: "Wanasayansi wa neva wameanza kuelewa uwezo wa ajabu wa watoto wachanga wa kujifunza lugha. Katika miezi sita, mtoto anaweza kuelewa sauti zinazojumuisha maneno ya Kiingereza, au maneno kutoka kwa lugha nyingine yoyote inayozungumzwa zaidi ya 7,000. Akifunuliwa kwa lugha ya pili, anaweza pia kupata lugha hiyo. Katika kipindi hiki mlango wa ajabu wa kiakili unafunguka, ukiruhusu watoto wachanga kutofautisha sauti arobaini hivi ambazo kwa ujumla huunda lugha ya asili kutoka kwa sauti 800 tofauti wanazoweza kuzielewa wakati wa kuzaliwa. Lakini kuna jambo moja: watoto wachanga lazima wazungumzwe. Unaweza kuiita masomo ya sauti kwa watoto wachanga."

---
  title: "Profetoimisen lahja"
  description: "Neurotieteilijät ovat alkaneet ymmärtää ihmisvauvojen uskomattoman hyvää kykyä oppia kieltä. Kuuden kuukauden ikäinen vauva voi ymmärtää äänteitä minkä tahansa yli 7 000 puhutun kielen sanoista. Jos vauva altistuu kuulemaan toista kieltä, hän voi oppia myös sen. Tänä aikana ihmismieleen aukeaa arvoituksellinen ovi. Vauvat voivat erottaa noin 40 ääntä, joista äidinkieli yleensä koostuu, niistä 800 erilaisesta äänestä, jotka vastasyntynyt pystyy erottamaan. Tälle on kuitenkin olemassa yksi ehto: vauvoille pitää puhua. Voidaan varmaankin sanoa, että kyse on vastasyntyneiden äänenmuodostuksen oppitunneista."

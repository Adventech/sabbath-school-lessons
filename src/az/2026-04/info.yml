  title: "Peyğəmbərlik ənamı"
  description: "Neyroalimlər insan körpələrinin dil mənimsəməkdəki möhtəşəm qabiliyyətini anlamağa başlayıblar. Altı aylıq körpə ingilis sözlərini və ya 7 000-dən çox danışılan digər dillərdən hər hansı birinin sözlərini təşkil edən səsləri ayırd edə bilir. Əgər körpə ikinci dilə də məruz qalarsa, həmin dili də mənimsəyə bilər. Bu dövrdə körpənin zehnində sirli bir qapı açılır və bu, ona doğulduğu zaman eşidə bildiyi 800 müxtəlif səs arasından ana dilini ümumiyyətlə təşkil edən təxminən 40 səsi ayırd etməyə imkan verir. Lakin burada bir şərt var: körpələrlə danışmaq lazımdır. Buna yeni doğulmuş körpələr üçün səs dərsləri də deyə bilərsiniz."

---
  title: "Dar proroctví"
  description: "Vědci zkoumající lidský mozek začínají lépe rozumět obdivuhodné schopnosti malých dětí osvojovat si jazyk. Už půlroční dítě vnímá zvuky, které tvoří jeho mateřský jazyk. Pokud je zároveň vystaveno i dalšímu jazyku, dokáže si osvojit i ten. V tomto období se v jeho mysli otevírá jedinečný prostor, díky němuž rozlišuje přibližně čtyřicet zvuků svého mateřského jazyka z asi osmi set různých zvuků, které je schopno vnímat po narození. Podmínkou však je, aby na ně lidé mluvili. Jsou to jakési „hlasové lekce“ pro nejmenší děti."

---
  title: "El don de profecía"
  description: "Los neurocientíficos han comenzado a comprender la maravillosa facilidad con la que los bebés humanos adquieren el lenguaje. A los 6 meses, un bebé puede comprender los sonidos que componen las palabras de cualquiera de los más de 7 000 idiomas hablados. Si se los expone a una segunda lengua, también pueden adquirirla. Durante este período se abre una misteriosa puerta mental que permite a los bebés distinguir los aproximadamente 40 sonidos que generalmente componen una lengua materna de los 800 sonidos diferentes que pueden percibir al nacer. Pero eso requiere hablarles, como si se tratara de clases de fonética para recién nacidos."

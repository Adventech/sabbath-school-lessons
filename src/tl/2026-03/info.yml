  title: "Una at Ikalawang Corinto"
  description: "Ang pagsusulat ng mga liham ay isang sinaunang gawain na hindi kailanman nawalan ng kabuluhan. Nagbago lamang ang paraan ng pagsusulat ng mga ito. Totoo, pinalitan na ng social media ang papel. Gayunpaman, sa kanilang pinakadiwa, ang mga email at iba pang anyo ng elektronikong liham ay may parehong tungkulin: pinag-uugnay nila ang mga tao sa pamamagitan ng pagpapalitan ng impormasyon, damdamin, at kaisipan."

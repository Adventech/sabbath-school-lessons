---
  title: "Ang Kaloob ng Propesiya"
  description: "Nagsisimula nang maunawaan ng mga neuroscientist ang kahanga-hangang kakayahan ng mga sanggol na matuto ng wika. Sa edad na anim na buwan, kaya nang maunawaan ng isang sanggol ang mga tunog na bumubuo sa mga salita sa Ingles, o sa alinmang isa sa higit sa 7,000 iba pang mga wikang sinasalita sa buong mundo. Kung tuturuan ng isang pangalawang wika, maaari rin nilang matutunan ang wikang iyon. Sa panahong ito, bumubukas ang isang mahiwagang pintuan sa isipan, na nagpapahintulot sa mga sanggol na matukoy ang humigit-kumulang 40 na tunog na karaniwang bumubuo sa isang katutubong wika mula sa 800 iba pang tunog na kanilang naririnig mula pagkasilang. Ngunit may isang kondisyon: kailangan silang kausapin. Maaari mo itong tawaging voice lessons para sa mga bagong silang."

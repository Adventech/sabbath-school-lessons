---
  title: "ውህበት ትንቢት"
  description: "ተመራመርቲ ስነ-ኣእምሮ ነቲ ዘገርም ናይ ሕጻናት ቋንቋ ናይ ምስትውዓል ክእለቶም ክግንዘብዎ ጀሚሮም ኣለዉ፡፡ ኣብ ሻድሻይ ዓመቱ ሓደ ቆልዓ ን ድምጺ ቋንቋ ቃላት ወለዱ ወይ ናይቶም ኣብ ዙርይኡ ዝዝረቡ ልዕሊ 7000 ዝዝረቡ ካልኦት ቋንቋታት ድምጽታት እውን ምስትውዓል ይጅምር፡፡ ንካልኣይ ቋንቋ እንተ ተቓሊዖም እውን ከስተውዕልዎ ይጅምሩ እዮም፡፡ ኣብዚ ዕድመዚ ዘገርም ምስጢራዊ አእምሮኣዊ በሪ ይኸፈት እሞ ካብ ኣብ እዋን ምውላዶም ዝሰምዕዎም ኣስታት 800 ድምጽታት ንኣርብዓ 40 ዝኾኑ ካባታቶም ምልላይ ይጅምሩ፡፡ ኣብዚ ኣገዳሲ ነገር ንህፃናት ክንነዛረቦም ይግብኣና፡፡ እዚ ትምህርቲ ድምጺ ንህጻናት ክበሃል ይከኣልዩ፡፡"

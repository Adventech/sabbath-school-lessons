  description: "Oososayensi abajongene nemithambo-luvo baqalile ukuqonda ummangaliso wesipho sokuzuza ulwimi kwiintsana zabantu. Ngeenyanga ezintandathu, usana luyakwazi ukuqonda izandi ezenza amagama esiNgesi, okanye nakoluphi kwiilwimi ezingama-7000 ukudlula ezithethwayo. Xa bebekwe esichengeni solwimi lwesibini, bangalubamba nalo olo lwimi. Ngeli xesha, ucango lwengqondo oluyimfihlakalo luyavuleka, luzivumele iintsana ukuba zahlule ama-40 okanye kufuphi apho ezandi eziye zenze ulwimi lwenkobe kuma-800 ezandi ezahlukeneyo ezinokuziqonda ekuzalweni. Phofu ikho into enye ebambayo: abantwana kufuneka kuthethiwe nabo. Ungade uthi zizifundo zelizwi kwabasanda kuzalwa."

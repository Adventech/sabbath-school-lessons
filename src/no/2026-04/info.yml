---
  title: "Profetiens gave"
  description: "Nevrovitenskapen har begynt å forstå spedbarnets evne til å tilegne seg språk. Når barnet er et halvt år gammelt, kan det forstå lydene som norske ord består av, eller ord fra et hvilket som helst av de over 7000 andre språkene som snakkes. Blir de utsatt for et annet språk, kan de også tilegne seg det språket. I denne perioden åpnes en mystisk mental dør som gjør at babyer kan skille de cirka 40 lydene som vanligvis utgjør et morsmål, fra de 800 andre lydene som de kan oppfatte ved fødselen. Men det er en hake ved dette: Spedbarn må snakkes til. Man kan kalle det stemmetimer for nyfødte."

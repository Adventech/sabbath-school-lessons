  title: "Simcianak Thilpek"
  description: "Neuroscientists pawl cun minung naute pawl ih an tongkam cangvaihdan mangbangza hi an theithiam. Thla 6 an kim ah nauhakte pakhat cun laitong fang a awndan a theithiam asilole tongdang 7,000 tlun kai ih awthluk dan pawl a theithiam. Tongdang hman a si le an kai ol ve hngal. Himi mangbangza tikcu caan a um lai ahhin an thinlung cu kau zetin a ongaw ih, an suah tik ih thil awn mi 800 tlun lai ihsin mai suahpi tong dangdang 40 tlun hrawng cu an kai cih ve mai. Asinan thil pakhat a um mi cu: Nauhak pawl cu an tong thei tengteng ding timi hi a si. Cui thil cu nausuak pek hrangih an zirmi zirlai tin na rel thei ding."

---
  title: "Le don de prophétie"
  description: "Les neuroscientifiques commencent à comprendre la merveilleuse capacité des nourrissons humains dans l’acquisition du langage. À 6 mois, un bébé peut comprendre les sons qui composent les mots français, ou les mots de n’importe laquelle des 7 000 autres langues qui existent dans le monde. S’ils sont exposés à une deuxième langue, ils peuvent également l’acquérir. Au cours de cette période, une mystérieuse porte mentale s’ouvre, permettant aux nourrissons de distinguer les quelque 40 sons qui composent généralement une langue maternelle parmi les 800 sons différents qu’ils peuvent percevoir à la naissance. Mais il y a une condition: il faut leur parler. On pourrait appeler cela des cours de chant pour nouveau-nés."

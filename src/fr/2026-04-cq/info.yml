---
  title: "Le don de prophétie"
  description: "Les neuroscientifiques ont commencé à comprendre l’incroyable capacité des nourrissons à apprendre le langage. À l’âge de six mois, un bébé est capable de comprendre les sons qui composent n’importe laquelle des plus de 7 000 langues parlées dans le monde. S’il est exposé à une deuxième langue, il peut aussi l’acquérir. Au cours de cette période, une mystérieuse porte mentale s’ouvre, permettant aux nourrissons de distinguer la quarantaine de sons qui composent généralement une langue maternelle parmi les huit cents sons différents qu’ils peuvent percevoir à la naissance. Mais il y a une condition: il faut parler aux bébés. On pourrait appeler cela des cours de chant pour nouveau-nés!"

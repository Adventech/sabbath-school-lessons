---
  title: "Le don de prophétie"
  description: "Les neuroscientifiques commencent à peine à percer le secret de l’incroyable faculté des nourrissons à acquérir le langage. Dès l’âge de six mois, un bébé est capable de distinguer les sons fondamentaux du français, ou de n’importe quelle autre des sept mille langues parlées dans le monde. S’il y est exposé, il peut tout aussi bien en apprendre une seconde. Durant cette phase, une véritable « porte mentale » s’ouvre, lui permettant de filtrer, parmi les huit cents sons perçus à la naissance, les quelque quarante phonèmes qui composeront sa langue maternelle. Une condition demeure toutefois essentielle: l’interaction humaine. On pourrait ainsi parler de « leçons de voix » pour nouveau-nés."

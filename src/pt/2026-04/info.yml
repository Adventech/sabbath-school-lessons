  title: "O dom de profecia"
  description: "Os neurocientistas estão começando a compreender a extraordinária facilidade que os bebês têm para aprender a se comunicar. Aos seis meses de idade, um bebê já consegue reconhecer os sons que formam as palavras do seu idioma – ou de qualquer outro entre os mais de 7 mil idiomas falados no mundo. Se for exposto a uma segunda língua, poderá aprendê-la também."

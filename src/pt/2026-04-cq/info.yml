  title: "Profetas: Natureza e propósito do dom de profecia"
  description: "A capacidade de comunicação humana é extraordinária. Por que Deus nos concederia esse dom se não tivesse a intenção de falar conosco? Trata-se de uma pergunta retórica, pois a Bíblia afirma: “Antigamente, Deus falou, muitas vezes e de muitas maneiras, aos pais, pelos profetas, mas, nestes últimos dias, nos falou pelo Filho, a quem constituiu herdeiro de todas as coisas e pelo qual também fez o Universo” (Hb 1:1, 2)."

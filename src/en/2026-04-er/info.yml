  title: "The Gift of Special Messages"
  description: "Neuro scientists study how nerves, the brain, and spinal cord work. They are starting to understand better how the brains of babies work. At 6 months old, a baby can understand many sounds that are part of the English language. If babies hear another language at that time, they can learn that language, too. During this time, babies can understand the 40 or more sounds that are part of their parents’ language. They can tell these sounds apart from the 800 other sounds they can understand when they are born. But for babies to develop this special skill, something important must happen first. People must speak to the babies. So, you can say that speaking to a baby is the same as ‘voice lessons’ for newborns!"

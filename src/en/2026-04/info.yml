---
  title: "The Gift of Prophecy"
  description: "Neuroscientists have begun to understand the marvelous facility of human infants for language acquisition. At six months, a baby can understand the sounds that comprise English words, or words from any of the other 7,000-plus spoken languages. If exposed to a second language, they can acquire that language, as well. During this period a mysterious mental door opens, allowing infants to distinguish the forty or so sounds that generally make up a native language from the 800 different sounds that they can perceive at birth. But there is one catch: babies must be spoken to. You might call it voice lessons for newborns."

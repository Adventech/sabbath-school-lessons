  title: "The Gift of Prophecy"
  description: "Neuroscientists have begun to understand human infants’ incredible ability to learn language. At six months of age, a baby can understand the sounds that comprise any of the seven thousand-plus spoken languages in the world. If exposed to a second language, they can acquire that language as well. During this period, a mysterious mental door opens, allowing infants to distinguish the forty or so sounds that generally make up a native language from the eight hundred different sounds that they can perceive at birth. But there is one catch: babies must be spoken to. You might call it voice lessons for newborns."

  title: "Пайғамбарлық сыйы"
  description: "Нейробиологтар нәрестелердің тілді меңгеру қабілетіне енді ғана жете бастады. Алты айда бала ана тілінің дыбыстарын және әлемнің жеті мыңнан астам тілінің кез-келгенін ажыратады. Егер жақын жерде екінші тіл естілсе, нәресте оны да игереді. Осы кезеңде баланың санасында жұмбақ есік ашылғандай: бала туылғаннан бастап қабылдай алатын сегіз жүз түрлі дыбыстардың ішінен ол қырыққа жуық — ана тілінің дыбыстық негізін құрайтын дыбыстарды шығара бастайды. Бірақ бір шарт бар: нәрестемен сөйлесу керек. Мұны жаңа туған нәрестелерге арналған сөйлеу сабақтары деп атауға болады."

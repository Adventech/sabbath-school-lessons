  title: "Дар пророчества"
  description: "Нейробиологи только начинают постигать поразительную способность младенцев осваивать язык. Уже в полгода ребенок различает звуки родной речи — да и любого из более чем семи тысяч языков мира. Если рядом звучит второй язык, малыш освоит и его. В этот период в сознании младенца словно открывается таинственная дверь: из восьмисот различных звуков, которые ребенок способен воспринимать с рождения, он начинает выделять около сорока — те, что составляют звуковую основу его родного языка. Но есть одно условие: с младенцем нужно разговаривать. Можно назвать это уроками речи для новорожденных."

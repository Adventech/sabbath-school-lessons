  title: "Заключительные Сцены Земной Жизни Спасителя"
  description: "«Бог есть любовь» (1 Ин. 4:8) — это невероятное утверждение о Боге записано в Священном Писании. Здесь не говорится, что Он просто обладает определенной долей любви или только иногда проявляет любовь, но что Он является воплощением и источником всей любви во Вселенной. Из 1 Кор. 13:5 мы узнаем, что любовь по своей природе не эгоцентрична — она сосредоточена на других. И нигде она не проявляется так ярко, как в заключительных сценах земной жизни Иисуса."

---
  title: "Дарот на пророштвото"
  description: "Ова тримесечје ќе го проучуваме дарот на пророштвото, Божјата генијална иновација за соопштување на Неговата волја и пат на грешните човечки суштества, кои повеќе не можат да разговараат со Него лице в лице. Овој посебен дар на Светиот Дух посебно е истакнат во главите: 1. Коринтјаните 12, 1. Коринтјаните 14, Ефесјаните 4 и Римјаните 12. Светиот Дух е Големиот Дарител на овој и на сите други духовни дарови, „распределувајќи секому поодделно, како што сака“ (1. Коринтјаните 12,11). Со текот на времето, вдахновените гласници ги пренесувале божествените пораки за да го поправат и обноват нашиот однос со Бога, исто како што направил Бог во Едем по Падот во грев. Ќе дознаеме како Бог ги повикува пророците и како можеме да ја провериме нивната автентичност. Ќе ги согледаме сличностите и разликите меѓу старозаветните и новозаветните пророци, и ќе стекнеме практично разбирање за улогата што откровението и вдахновението ја имале во нивниот живот. Додека некои пророци зборувале, некои пишувале, а некои го правеле и едното и другото. Ќе ги проучиме овие и други начини на божественото обраќање на луѓето, нивното значење и благословите што произлегуваат од послушноста кон пораките што ги пренесувале овие пророци."

  title: "Α’ και Β’ προς Κορινθιους Επιστολες"
  description: "Η γραφή επιστολών είναι μια δραστηριότητα αιώνων που δεν έχει καταστεί ξεπερασμένη. Απλώς έχουμε αλλάξει τον τρόπο με τον οποίο γράφονται οι επιστολές. Ναι, τα μέσα κοινωνικής δικτύωσης έχουν αντικαταστήσει το χαρτί. Ωστόσο, στην ουσία τους, οι ηλεκτρονικές επιστολές και άλλες μορφές ηλεκτρονικής αλληλογραφίας επιτελούν βασικά την ίδια λειτουργία: συνδέουν τους ανθρώπους μέσω της ανταλλαγής πληροφοριών, συναισθημάτων και σκέψεων."

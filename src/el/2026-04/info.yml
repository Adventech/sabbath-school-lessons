  title: "Το χαρισμα της προφητειας"
  description: "Οι νευροεπιστήμονες αρχίζουν πλέον να καταλαβαίνουν πώς τα βρέφη μαθαίνουν να μιλούν τόσο γρήγορα. Σε ηλικία έξι μηνών, ένα μωρό μπορεί να κατανοήσει τους ήχους που συνθέτουν τις λέξεις από οποιαδήποτε από τις 7.000 και πλέον ομιλούμενες γλώσσες. Εάν το μωρό εκτεθεί σε μια δεύτερη γλώσσα, μπορεί να την αποκτήσει και αυτή. Κατά τη διάρκεια αυτής της περιόδου, ανοίγει μια μυστηριώδης πνευματική «πόρτα», επιτρέποντας στα βρέφη να ξεχωρίζουν τους περίπου 40 ήχους που συνήθως αποτελούν τη μητρική τους γλώσσα από τους 800 διαφορετικούς ήχους που μπορούν να αντιληφθούν κατά τη γέννησή τους. Υπάρχει όμως μια προϋπόθεση: κάποιος πρέπει να μιλάει στα μωρά. Θα μπορούσε κανείς να το ονομάσει «μαθήματα φωνητικής» για νεογέννητα."

---
  title: "අනාගතවාක්‍ය දීමනාව"
  description: "මිනිස් බිළිඳුන්ට භාෂාවන් ග්‍රහණය කර ගැනීමට ඇති අපූර්ව හැකියාව පිළිබඳව ස්නායු විද්‍යාඥයන් (Neuroscientists) දැන් කරුණු වටහා ගැනීමට පටන් ගෙන ඇත. මාස හයක් වන විට, බිළිඳකුට ඉංග්‍රීසි වචන හෝ ලොව පුරා කථා කරන අනෙකුත් 7,000කට අධික භාෂාවන්ගෙන් සමන්විත ශබ්ද තේරුම් ගතහැකිය. ඔවුන් දෙවන භාෂාවකට නිරාවරණය වුවහොත්, එම භාෂාවද පහසුවෙන් ඉගෙන ගැනීමට ඔවුන්ට හැකියාව ඇත. මෙම කාලය තුළ, අභිරහස් මානසික ද්වාරයක් විවෘත වන අතර, එමඟින් බිළිඳුන්ට උපතේදී හඳුනාගත හැකි විවිධ ශබ්ද 800ක් අතරින් තම මව් භාෂාවට අදාළ ශබ්ද 40ක් පමණ වෙන් කර හඳුනා ගැනීමට අවස්ථාව ලැබේ. නමුත් මෙහි එක් කොන්දේසියක් ඇත: එනම් බිළිඳුන් සමඟ යමෙකු කතා කළ යුතුය. මෙය ඔබට අලුත උපන් බිළිඳුන් සඳහා වන \"කටහඬ පුහුණු සැසියක්\" ලෙස හැඳින්විය හැකිය."

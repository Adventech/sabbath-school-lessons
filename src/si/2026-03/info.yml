---
  title: "පළමුවෙනි සහ දෙවෙනි කොරින්ති"
  description: "ලිපි ලිවීම චිරාගත ක්‍රියාවලියක් වුවද, මේවනතුරුත් එය යල්පැනගිය එකක් බවට පත්ව නැත. අප සිදුකර ඇත්තේ ලිපි ලිවීමේ ක්‍රම වේදයෙහි වෙනසක් පමණි. ඇත්ත වශයෙන්ම සමාජ මාධ්‍යය කඩදාසි භාවිතය අභිබවා ගොස් ඇත. මෙහි හරය ගත් විට  ඊ-මේල් සහ නොයෙක් ආකාරයේ වෙනත් විද්‍යුත් තැපෑල මගින් මූලික වශයෙන්ම ඉටු වන්නේ එම ක්‍රියාවලියමය. එමගින්, තොරතුරු හුවමාරුවෙන් හැඟීම් සහ සිතුවිලි හුවමාරු කිරීමෙන් මනුෂ්‍යයන්ව එකට සම්බන්ධ කරනු ලබයි."

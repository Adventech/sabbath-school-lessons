  title: "Ân Tứ Tiên Tri"
  description: "Các nhà khoa học thần kinh đã bắt đầu hiểu được khả năng kỳ diệu của trẻ sơ sinh trong việc tiếp thu ngôn ngữ. Khi được 6 tháng tuổi, một em bé có thể nhận biết các âm thanh cấu thành từ ngữ tiếng Anh, hoặc từ ngữ của bất kỳ ngôn ngữ nào trong hơn 7.000 ngôn ngữ được nói trên thế giới. Nếu được tiếp xúc với một ngôn ngữ thứ hai, các em cũng có thể tiếp thu ngôn ngữ ấy. Trong giai đoạn này, một “cánh cửa” tinh thần đầy huyền nhiệm mở ra, cho phép trẻ phân biệt khoảng 40 âm thanh thường cấu thành nên ngôn ngữ mẹ đẻ, giữa hơn 800 âm thanh mà các em có thể cảm nhận lúc mới sinh. Nhưng có một điều kiện: trẻ phải được nói chuyện. Có thể gọi đó là những “bài học giọng nói” dành cho trẻ sơ sinh."

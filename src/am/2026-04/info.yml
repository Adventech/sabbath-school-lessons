---
  title: "የትንቢት ስጦታ"
  description: "ዳምና ሄዋን ከእግዚአብሔር ጋር የነበራቸውን ግንኙነት ኃጢአት ሲያወድመው እግዚአብሔር ራሳቸውን ያጥፉ ብሎ እጁን ታጥቦ አልተዋቸውም። ሁለቱንም “የት ናችሁ?” እያለ ሊፈልጋቸው መጣ (ዘፍ 3:9)። ዓለምን ከኃጢአቷ ስለሚያድነው አዳኝ መወለድ ትንቢት ተናገረ (ዘፍ 3:15)። ከውድቀት በኋላ በዚያው በኤደን ውስጥ ትንቢት ኢየሱስን ከፍ ከፍ በማድረግ ኃጢአተኞችን ብቸኛ ተስፋቸው ወደ ሆነው ወደ እርሱ አመላከታቸው።"

  title: "Ny Fanomezam-pahasoavan'ny Faminaniana"
  description: "Efa manomboka mahatakatra ny fomba mahagaga ahaizan'ny zazakely mianatra miteny mora foana ireo mpahay siansa momba ny rafi-pitatitra (\"Neuroscientifique\"). Eo amin'ny fahenim-bolany, ny zaza iray dia efa afaka mahafantatra ireo feo mandrafitra ny teny anglisy, na teny hafa ao anatin'ireo tenim-pirenena mihoatra ny 7000 ampiasaina manerana izao tontolo izao. Raha misy tenim-pirenena faharoa aza ifampiresahana ao amin'ny tontolo misy azy, dia mety ho hainy koa izany. Mandritra io fotoana io dia misy vavahadin-tsaina misokatra amin'ny fomba mahagaga, izay mahatonga ny zazakely hahay hanavaka ireo feo miisa 40 eo ho eo, izay mandrafitra ny fitenin-drazany, amin'ireo feo 800 samy hafa izay reny raha vao teraka izy. Nefa misy fepetra iray: tsy maintsy iresahana ny zaza. Azo lazaina ho toy ny fampianaran-kira ho an'ny zaza vao teraka izany."

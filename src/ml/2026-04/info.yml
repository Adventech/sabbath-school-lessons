  title: "പ്രവചനവരം"
  description: "നാഡീവ്യവസ്ഥയെക്കുറിച്ചും തലച്ചോറിന്റെ പ്രവർത്തനത്തെക്കുറിച്ചും ഗവേഷണം നടത്തുന്ന ശാസ്ത്രജ്ഞർ, മനുഷ്യശിശുക്കളുടെ ഭാഷാ സമ്പാദനത്തിനുള്ള അദ്ഭുതകരമായ സൗകര്യം മനസ്സിലാക്കാൻ തുടങ്ങി. 6 മാസം പ്രായമായ, ഒരു കുഞ്ഞിന് ഇംഗ്ലീഷ് വാക്കുകൾ ഉൾക്കൊള്ളുന്ന ശബ്ദങ്ങളോ മറ്റ് 7,000 ത്തിലധികം സംസാരിക്കുന്ന ഭാഷകളിൽ നിന്നുള്ള വാക്കുകളോ മനസ്സിലാക്കാൻ കഴിയും. രണ്ടാമത്തെ ഭാഷയുമായി സമ്പർക്കം പുലർത്തുകയാണെങ്കിൽ അവർക്ക് ആ ഭാഷയും സ്വന്തമാക്കാം. ഈ കാലയളവിൽ ഒരു നിഗൂഢമായ മാനസിക വാതിൽ തുറക്കുന്നു. ഇതു ശിശുക്കൾക്ക് ജനനസമയത്തു തിരിച്ചറിയാൻ കഴിയുന്ന 800 വ്യത്യസ്ത ശബ്ദങ്ങളിൽ നിന്ന് സാധാരണയായി ഒരു പ്രാദേശിക ഭാഷ ഉണ്ടാക്കുന്ന 40 അല്ലെങ്കിൽ അതിൽ കൂടുതൽ ശബ്ദങ്ങൾ വേർതിരിച്ചറിയാൻ അവർക്കു കഴിയും. എന്നാൽ ഒരു കാര്യമുണ്ട്. കുട്ടികളോട് സംസാരിക്കണം. നവജാത ശിശുക്കൾക്കുള്ള ശബ്ബത്ത് പാഠങ്ങൾ എന്ന് നിങ്ങൾക്ക് ഇതിനെ വിളിക്കാം."

  title: "Ka Jingai Jong Ka Jingiathuhlypa"
  description: "Ki stad saian jong ka khlieh ki la sdang ban sngewthuh ïa ka jinglah kaba phylla jong ki khyllung briew ban nang ïa ka ktien. Ha ka rta kaba hynriew bnai, i khunlung i lah ban sngewthuh ïa ki sur kiba kynthup ïa ki kyntien phareng, lane ki kyntien na kano kano na kiwei pat ki ktien ba kren ïa palat 7,000 tylli. Lada ki iohsngew sa ïa kawei pat ka jait ktien kaba ar, ki lah ban nang ïa kata ka ktien, kumjuh. Ha kane ka por, kaba sngewphylla ka long ba ka jingkhang jong ka jabieng ka plie, kaba ailad ïa ki khyllung ban pyniapher ïa ki 40 tylli ki sur kiba ha ka jingmut kaba kyllum lang kiba pynlong ïa ka ktien tynrai na ki 800 tylli ki sur bapher bapher kiba ki lah ban sngewthuh ha ka por ba kha ïa ki. Hynrei ka don kawei ki ioh kem: ka dei ba ki khyllung ki dei ban kren. Phi lah ban khot ïa ka ki jinghikai sur na ka bynta ki khyllung ba dang shu kha."

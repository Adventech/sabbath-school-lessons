---
  title: "ಪ್ರವಾದನೆಯ ವರ"
  description: "ನರ ವಿಜ್ಞಾನಿಗಳು ಹಸಿಗೂಸುಗಳ ಭಾಷೆಯನ್ನು ಗ್ರಹಿಸುವ ಅದ್ಭುತವಾದ ಮಾನವ ಸಾಮರ್ಥ್ಯವನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಪ್ರಯತ್ನ ಮಾಡುತ್ತಿದ್ದಾರೆ. ಆರು ತಿಂಗಳುಗಳಲ್ಲಿ, ಒಂದು ಮಗು ಸುಮಾರು ಮಾತೃಭಾಷೆಯ ಸುಮಾರು 7000 ಕ್ಕಿಂತ ಹೆಚ್ಚಾದ ಪದಗಳನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವ ಸಾಮರ್ಥ್ಯವನ್ನು ಹೊಂದಿರುತ್ತದೆ. ಅದೇ ರೀತಿಯಲ್ಲಿ ಎರಡನೆಯ ಭಾಷೆಯನ್ನು ಕೂಡ ಗ್ರಹಿಸುವ ಶಕ್ತಿಯನ್ನು ಹೊಂದಿರುತ್ತದೆ. ಈ ಹಂತದಲ್ಲಿ ನಿಗೂಢವಾದ ಮಾನಸಿಕ ಬಾಗಿಲು ತೆರೆಯುಲ್ಪಡುವುದು, ಈ ಹಂತದಲ್ಲಿ ಮಗುವು 40ಕ್ಕೂ ಅಥವಾ ಅದಕ್ಕಿಂತ ಹೆಚ್ಚು ಮಾದರಿಯ ಶಬ್ದಗಳನ್ನು ಹಾಗೂ 800 ವಿಭಿನ್ನವಾದ ಶಬ್ದಗಳನ್ನು ಒಳಗೊಂಡಿರುವ ಮಾತೃ ಭಾಷೆಯನ್ನು ಗ್ರಹಿಸುತ್ತದೆ. ಇದನ್ನು ನಾವು ಮಗುವಿನ ಶಬ್ದಗ್ರಹಿಕೆಯ ಸಾಮರ್ಥ್ಯವೆಂದು ಕರೆಯಬಹುದು."

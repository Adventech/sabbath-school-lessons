  title: "Дар пророцтва"
  description: "Нейробіологи почали розуміти дивовижну здатність немовлят до вивчення мови. У шість місяців дитина може розуміти звуки, з яких складаються англійські слова, або слова з будь-якої з понад 7000 розмовних мов. Якщо дитина познайомиться з другою мовою, вона може опанувати і цю мову. У цей період відкриваються таємничі ментальні двері, що дозволяють немовлятам розрізняти приблизно сорок звуків, які зазвичай складають рідну мову, з 800 різних звуків, які вони можуть сприймати при народженні. Але є одна заковика: з немовлятами потрібно розмовляти. Можна назвати це уроками голосу для новонароджених."

---
  title: "Panurirangon"
  description: "Angka dokter saraf mamungka marnida hagogoon na sun di sada posoposo na mangantusi hata. Marumur onom bulan, sada posoposo tarbahenna mangalapati soara sian pangkuling, nang dohot di hata pangkuling na asing. Molo dipatandahon dohot hata na asing, tarbahenna do manangkup hata i. Di bagasan partingikian on, ungkap do harbangan ni parange na gok hahomion, na patauhon posoposo mananda lobi sian 40 soara na somalna patandahon soara ni sahalak ina sian 800 soara na marragam na dipangkilalahon nasida sian parsorangna. Alai, adong sada dalanna: posoposo i na ingkon do dipangkulingi. Goari hamuna ma i na gabe parsiajaran soara tu posoposo na imbaru sorang."

  title: "भविष्यद्वाणी का दान"
  description: "न्यूरोवैज्ञानिकों (मस्तिष्क वैज्ञानिकों) ने भाषा सीखने की इंसानी बच्चों की अद्भुत क्षमता को समझना शुरू कर दिया है । छह महीने की उम्र में, एक बच्चा अंग्रेजी भाषा की ध्वनियों (आवाजों) या दुनिया की 7,000 से अधिक बोली जाने वाली भाषाओं में से किसी भी भाषा के शब्दों को समझ सकता है । यदि उन्हें किसी दूसरी भाषा के माहौल में रखा जाए, तो वे उसे भी सीख सकते हैं ।"

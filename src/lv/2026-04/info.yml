---
  title: "Pravietošanas dāvana"
  description: "Neirozinātnieki ir sākuši izprast zīdaiņu apbrīnojamo spēju apgūt valodu. Sešu mēnešu vecumā bērns spēj atšķirt skaņas, no kurām veidojas angļu valodas vārdi vai vārdi jebkurā citā no vairāk nekā 7000 dzīvajām valodām. Ja bērns tiek pakļauts otrās valodas ietekmei, viņš var apgūt arī šo valodu. Šajā periodā atveras noslēpumainas mentālās durvis, ļaujot zīdaiņiem atšķirt apmēram 40 skaņas, kas parasti veido dzimto valodu, no 800 dažādām skaņām, kuras viņi spēj uztvert jau dzimšanas brīdī. Bet ir viens nosacījums: ar zīdaiņiem ir jārunā. To varētu nosaukt par balss nodarbībām jaundzimušajiem."

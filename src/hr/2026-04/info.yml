  title: "Dar Duha proroštva"
  description: "Neuroznanstvenici su počeli razumijevati čudesnu sposobnost ljudske novorođenčadi za učenje jezika. Sa šest mjeseci dijete može razumjeti glasove od kojih se sastoje riječi iz bilo kojeg od sedam tisuća govornih jezika. Ako je izloženo drugom jeziku, može usvojiti i njega. Tijekom tog razdoblja otvaraju se tajanstvena vrata uma omogućavajući dojenčetu da razlikuje četrdesetak glasova od kojih se uglavnom sastoji njegov materinski jezik, između osamstotinjak drugih zvukova koje može opaziti pri rođenju. Međutim, postoji jedno ograničenje novorođenčadi se mora govoriti. Možete to nazvati glasovnim vježbama za novorođenčad."

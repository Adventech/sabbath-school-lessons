---
  title: "Kurnia Nubuat"
  description: "Pakar Sains saraf telah mula memahami kemudahan menakjubkan pada bayi manusia dalam pemerolehan bahasa. Pada usia 6 bulan, bayi boleh memahami bunyi-bunyi yang membentuk perkataan Inggeris, atau perkataan daripada mana-mana 7,000 bahasa lisan yang lain. Jika terdedah kepada bahasa kedua, mereka juga boleh memperoleh bahasa tersebut. Dalam tempoh ini, pintu mental yang misteri terbuka, membolehkan bayi membezakan kira-kira 40 bunyi yang biasanya membentuk bahasa ibunda daripada 800 bunyi berbeza yang boleh mereka rasai semasa lahir. Tetapi ada satu perkara penting: bayi mesti diajak bercakap. Anda boleh memanggilnya pelajaran suara untuk bayi yang baru lahir."

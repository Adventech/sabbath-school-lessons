  title: "Dar proroctwa"
  description: "Dar proroctwa. Neurobiolodzy badają zdumiewającą zdolność niemowląt do uczenia się mowy. W szóstym miesiącu życia niemowlę może zrozumieć dźwięki tworzące słowa w każdym z używanych obecnie języków świata. Jeśli ma okazję słyszeć inny język — z ponad siedmiu tysięcy języków — niż słyszany na co dzień, uczy się także tego dodatkowego języka. W tym wieku otwierają się niepojęte mentalne drzwi pozwalające niemowlęciu wyróżnić około czterdziestu dźwięków składających się na rodzimy język spośród ośmiuset różnych dźwięków, które niemowlę jest w stanie usłyszeć po narodzeniu. Jednak jest jeden warunek — trzeba do niemowlęcia mówić! Można zatem to nazwać lekcjami mowy dla niemowląt."

---
  title: "Peygamberlik Armağanı"
  description: "Sinirbilimciler, bebeklerin dil öğrenme konusundaki olağanüstü becerilerini anlamaya başladılar. Bir bebek altı aylıkken İngilizce sözcükleri ya da konuşulan diğer 7.000'den fazla dilden herhangi birindeki sözcükleri oluşturan sesleri ayırt edebilir. İkinci bir dile maruz bırakılırsa, o dili de edinebilir. Bu dönemde gizemli bir zihinsel kapı açılır ve bebeklerin, doğduklarında algılayabildikleri 800 farklı sesten, genellikle ana dillerini oluşturan 40 kadar sesi ayırt etmelerini sağlar. Ancak bir koşul vardır: Bebeklerle konuşulmalıdır. Buna, yeni doğanlar için “ses dersleri” de diyebilirsiniz."

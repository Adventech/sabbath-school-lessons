---
  title: "Die Gabe der Prophetie"
  description: "Neurowissenschaftler haben begonnen, die wunderbare Fähigkeit von Kleinkindern zum Erwerb von Sprache zu verstehen. Warum sollte Gott uns mit dieser wunderbaren Fähigkeit zur Spracherkennung und zum Spracherwerb erschaffen haben, wenn er nie vorgehabt hat, mit uns zu sprechen? In diesem Quartal beschäftigen wir uns mit der Gabe der Prophetie - Gottes genialem Einfall, um den gefallenen Menschen seinen Willen und seine Wege mitzuteilen."

---
  title: "El do de profecia"
  description: "Els neurocientífics han començat a entendre la meravellosa facilitat dels infants humans per a l'adquisició del llenguatge. Als sis mesos, un nadó pot comprendre els sons que componen les paraules angleses, o les paraules de qualsevol de les altres més de 7.000 llengües parlades. Si s'exposa a una segona llengua, també pot adquirir-la. Durant aquest període s'obre una misteriosa porta mental que permet als infants distingir els quaranta sons aproximats que generalment formen una llengua materna d'entre els 800 sons diferents que poden percebre en néixer. Però hi ha una condició: cal parlar als nadons. En podríem dir lliçons de veu per a nounats."

---
  title: "Dar proroctva"
  description: "Vedci skúmajúci mozog začínajú rozumieť obdivuhodnej schopnosti malých detí učiť sa jazyk. Už polročné bábätko vníma zvuky tvoriace jeho materinský jazyk. Ak je v kontakte s ďalšou rečou, osvojí si aj tú. V tomto veku sa v mysli dieťaťa otvára neznámy priestor, vďaka ktorému odlíši zhruba štyridsať zvukov materinského jazyka od asi osemsto rozličných zvukov, ktoré vníma hneď po narodení. Podmienkou však je, aby sme sa bábätkám prihovárali. Ide o akési „hlasové lekcie“ pre novorodencov."

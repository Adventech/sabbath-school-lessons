---
  title: "Impano y'Ubuhanuzi"
  description: "Abahanga mu by'imikorere y'ubwonko batangiye gusobanukirwa ubushobozi butangaje abana b'impinja baba bafite bwo kumenya ururimi. Iyo umwana agejeje ku mezi atandatu, aba ashobora kumva amajwi agize amagambo y'icyongereza cyangwa andi magambo yo mu zindi ndimi zirenga 7.000 zivugwa. Iyo bahuye n'ururimi rutari urwa kavukire, na rwo bashobora kurwumva. Muri icyo gihe, urugi rw'amayobera rwo mu bwenge bw'umwana rurafunguka, bigatuma ashobora gutandukanya amajwi agera kuri 40 y'ururimi kavukire n'amajwi agera kuri 800 ashobora kumva akimara kuvuka. Ariko kandi hari ikintu kimwe bisaba abana b'impinja bagomba kuganirizwa. Ushobora kubyita amasomo y'ijwi ahabwa abana bavutse vuba."

  title: "Hril Lâwkna Thilpêk"
  description: "Mihring thluak hnathawh dân zir mite (neuroscientists) chuan nausênte’n tawng an lo thiam theih nâna an thluakin hna a thawh dân an lo hre chho zêl a. Nausên chuan, thla 6 a lo tlinin a pianpui tawng (entîr nân, Mizo) emaw, khawvêla tawng hrang hrang 7,000 chuang awm zînga eng tawng pawh ni se, chumi tawng thumalte siamtu rî-te chu a lo hre hrang tan a. A pianpui tawng ni lo tawng dang rî pawh hriattîr thin ni ta se, chumi tawng pawh chu a lo hrethiam chhawm ve tho dâwn tihna a ni. Tin, hetih lâi vêl hian a rilru kawngka mak danglam tak chu lo inhawngin, a lo pian chhuaha a hriatthiam rî chi hrang hrang 800 vêl atanga amah châwi liantu a nu tawng siam chhuaktu rî 40 vêl zêl chu a lo hrethiam ta a. Mahse, chumi tûr chuan thil pakhat a thlen phawt a ngâi thung: amah chu biak lûmlâm thin a tûl thîn. Chutiang chu nausênte tâna tawng zirna ti pawhin kan sawi thei ang."

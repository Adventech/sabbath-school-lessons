  title: "ຂອງປະທານແຫ່ງຄໍາທໍານວາຍ"
  description: "ນັກວິທະຍາສາດດ້ານລະບົບປະສາດເລີ່ມເຂົ້າໃຈການເຮັດວຽກຂອງສະ ໝອງເດັກນ້ອຍໄດ້ດີຂື້ນ. ໃນໄວອາຍຸ 6 ເດືອນ, ເດັກນ້ອຍສາມາດເຂົ້າໃຈສຽງຕ່າງໆທີ່ເປັນພາສາອັງກິດໄດ້. ຖ້າເດັກນ້ອຍໄດ້ຍິນພາສາອື່ນໃນຊ່ວງເວລານັ້ນ, ພວກເຂົາກໍສາມາດຮຽນຮູ້ພາສານັ້ນໄດ້ເຊັ່ນກັນ. ໃນຊ່ວງເວລານີ້, ເດັກນ້ອຍສາມາດເຂົ້າໃຈສຽງຕ່າງໆຫຼາຍກວ່າ 40 ສຽງທີ່ເປັນພາສາຂອງພໍ່ແມ່ຂອງຕົນ. ພວກເຂົາສາມາດແຍກແຍະສຽງເຫຼົ່ານີ້ຈາກສຽງອື່ນໆອີກ 800 ສຽງທີ່ພວກເຂົາສາມາດເຂົ້າໃຈໄດ້ຕັ້ງແຕ່ຕອນເກີດ. ແຕ່ເພື່ອໃຫ້ເດັກນ້ອຍພັດທະນາທັກສະພິເສດນີ້, ມີສິ່ງທີ່ສໍາຄັນຕ້ອງເກີດຂຶ້ນກ່ອນ. ສິ່ງນັ້ນກໍຄື ຜູ້ຄົນຕ້ອງເວົ້າກັບເດັກ ນ້ອຍ. ສະນັ້ນ, ທ່ານອາດເວົ້າໄດ້ວ່າ ການເວົ້າກັບເດັກນ້ອຍກໍເໝືອນກັບ “ການສອນສຽງ” ໃຫ້ກັບເດັກເກີດທີ່ເກີດໃໝ່ນັ້ນເອງ!"

  title: 'Prohvetluse vaimuand'
  description: 'Neuroloogid on hakanud aru saama imikute imelisest võimest keelt omandada. Kuue kuu vanuselt suudab laps aru saada häälikutest, millest koosnevad sõnad keeles, mida ta kuuleb (olgu selleks mis tahes keel enam kui 7000 kõneldavast keelest). Kui nad puutuvad kokku teise keelega, saavad nad ka selle omandada. Sel perioodil avaneb salapärane vaimne uks ja võimaldab imikutel eristada 800 erinevast helist, mida nad sündides tajuvad, umbkaudu 40 häälikut, millest emakeel üldiselt koosneb. Aga siin on üks konks: lastega tuleb rääkida. Nimetagem seda vastsündinute hääletundideks.'

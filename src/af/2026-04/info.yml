---
  title: "Die Gawe van Profesie"
  description: "Wetenskaplike navorsers in neurologie het begin om die verbasende vaardighede te ondersoek wat suiglinge het om ’n taal te bemagtig. Op die ouderdom van 6 maande kan ’n baba die klanke waaruit Engelse woorde of enige van die ander 7,000+ tale bestaan, verstaan. Indien hulle blootgestel word aan ’n tweede taal, kan hulle daardie taal ook bemeester. Gedurende hierdie periode ontstaan daar ’n misterieuse verstandelike vermoë wat hulle toelaat om die 40 of meer klanke waaruit ’n moedertaal gewoonlik bestaan, te kan onderskei van die 800 verskillende klanke wat hulle by geboorte kan waarneem. Maar daar is een voorwaarde: daar moet met babas gepraat word. Jy kan daaraan dink om dit ‘stemlesse vir pasgeborenes te noem."

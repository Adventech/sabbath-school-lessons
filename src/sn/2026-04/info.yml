  title: "Chipo Chechiporofita"
  description: "Nyanzvi dzezveurapi hwetsinga dzemuviri dzavana dzave kutanga kunzwisisa kugona kunoshamisa kwevana vadiki pakudzidza mutauro. Kana mwana ava nemwedzi mitanhatu, anogona kunzwisisa manzwi anoumba mazwi eChirungu, kana mazwi emumwe wemimwe mitauro anodarika 7,000 inotaurwa munyika. Kana mwana achigara achinzwa mutauro wechipiri, anogonawo kudzidza mutauro iwoyo. Panguva iyi, zvinoita sokuti suo risinganzwisisiki remupfungwa rinovhurika, richibvumira vana kusiyanisa manzwi anenge makumi mana anowanzoumba mutauro waamai kubva pamanwi mazana masere avanokwanisa kunzwa pakuzvarwa. Asi pane chinhu chimwe chakakosha: vana vanofanira kutaurirwa. Tingati izvi zvidzidzo zvenzwi kuvana vachangoberekwa."

---
  title: "هِبة النبوّة"
  description: "بالنسبة لعلماء الأعصاب، لم تعد قدرة الأطفال الرضّع المُذهلة على تعلّم اللغة الأم سِرًّا يكتنفه الغموض. أصبح من المعروف، في يومنا هذا أنّ، الرضيع، في عمر الستة أشهر، يكتسب القدرة على التعرّف على الأصوات الّتي تتكوّن منها الكلمات في لغته الأمّ (سواء كانت الإنجليزية أو أيّاً من اللغات المنطوقة الأخرى والّتي يفوق عددها سبعة آلاف لغة)، وإن تمّ التكلّم بلغة ثانية على مسامعه فإنّه قادرٌ على اكتساب تلك اللغة أيضًا. خلال هذه الفترة الحاسمة، تنفتح في ذهن الطفل آلية تسمح له بتمييز الأربعين صوتًا الّتي تتألف منها لغته الأم عادةً، من بين ثمانمائة صوت يمكن أن يدركها عند الولادة. ومع ذلك، هناك شرط أساسي لا يمكن الاستغناء عنه: يجب أن يتمّ التحدّث إلى الطفل. يمكننا أن نطلق على هذه العملية اسم «دروس الصوتيات للمولود الجديد»."

  title: "Dhuntia e Profecisë"
  description: "Neuroshkencëtarët kanë filluar të kuptojnë aftësinë e mrekullueshme të foshnjave për të përvetësuar gjuhën. Në moshën 6-muajshe, një foshnjë mund të kuptojë tingujt që përbëjnë fjalët angleze, ose fjalët nga cilado prej 7,000 e kusur gjuhëve të tjera të folura. Nëse ekspozohen ndaj një gjuhe të dytë, ata mund ta përvetësojnë edhe atë gjuhë. Gjatë kësaj periudhe, hapet një derë misterioze mendore, duke i lejuar foshnjat të dallojnë rreth 40 tingujt, që në përgjithësi përbëjnë një gjuhë amtare nga 800 tingujt e ndryshëm që ata mund të perceptojnë në lindje. Por ka një kusht: foshnjave duhet t'u flitet. Mund ta quani mësime zëri për të porsalindurit."

  title: "អំណោយទាននៃបទទំនាយ"
  description: "អ្នកវិទ្យាសាស្ត្រខាងប្រព័ន្ធប្រសាទ បានចាប់ផ្ដើមយល់ដឹង អំពីសមត្ថភាពដ៏អស្ចារ្យរបស់ទារក ក្នុងការរៀន ភាសា។ នៅវ័យ៦ខែ ទារកអាចយល់នូវសំឡេងទាំងឡាយ ដែលបង្កើតឡើងជាពាក្យភាសាអង់គ្លេស ឬពាក្យមកពីភាសានិយាយដទៃទៀត ជាង ៧,០០០ ភាសា។ ប្រសិនបើពួកគេបានប្រឈមនឹងភាសាទីពីរ ពួកគេក៏អាចរៀនភាសានោះបានដូចគ្នាដែរ។ នៅក្នុងអំឡុងពេលនេះ ទ្វារផ្លូវចិត្តដ៏អាថ៌កំបាំងមួយ បានបើកឡើង ដែលអនុញ្ញាតឲ្យទារកអាចបែងចែកសំឡេងប្រហែល ៤០ សំឡេង ដែលជាទូទៅបង្កើតឡើងជាភាសាកំណើត ចេញពីសំឡេងខុសៗគ្នា ចំនួន ៨០០សំឡេង ដែលពួកគេអាចដឹងបានតាំងពីកំណើត។ ប៉ុន្តែមានលក្ខខណ្ឌមួយ៖ ទារកទាំងនោះត្រូវតែមានគេនិយាយជាមួយ។ លោកអ្នកអាចហៅវាថា ជាមេរៀនសំឡេងសម្រាប់ទារកទើបនឹងកើត។"

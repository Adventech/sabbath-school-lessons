---
  title: "தீர்க்கதரிசன வரம்"
  description: "மொழியைக் கற்றுக்கொள்வதில் குழந்தைகளுக்குள்ள ஆச்சரியமான திறனைப்பற்றி நரம்பியல் விஞ்ஞானிகள் தற்போது புரிந்துகொள்ளத் தொடங்கியுள்ளனர். தமிழ் வார்த்தைகளை அல்லது உலகில் பேசப்படும் 7,000 க்கும் மேற்பட்ட பிற மொழிகளின் வார்த்தைகளை உருவாக்குகிற ஒலிகளை ஆறுமாதக் குழந்தையால் புரிந்துகொள்ள முடியும். அந்தச் சமயத்தில் இரண்டாவது மொழியை அவர்களுக்கு அறிமுகப்படுத்தினால், அதையும் எளிதாகக் கற்றுக் கொள்வார்கள். இந்தக் காலக்கட்டத்தில் திறக்கிற விசித்திரமான ஒரு மனத்திறன், குழந்தைகள் பிறக்கும்போது உணருகிற 800 வெவ்வேறு ஒலிகளிலிருந்து, ஒரு தாய் மொழியை உருவாக்குகிற சுமார் 40 ஒலிகளை மட்டும் பிரித்தறிய உதவுகிறது. ஆனால் இதில் ஒரு நிபந்தனை உள்ளது: குழந்தைகளுடன் யாராவது பேசவேண்டும். இதை பிறந்த குழந்தைகளுக்கான 'குரல் பயிற்சி' என்று அழைக்கலாம்."

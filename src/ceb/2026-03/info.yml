  title: "Una ug Ikaduhang Corinto"
  description: "Ang pagsulat og mga sulat maoy usa ka kinaraang buluhaton nga dili mawala. Igo lang nato giusab ang paagi sa pagsulat sa mga sulat. Oo, ang social media mipuli na karon sa mga papel. Apan sa ilang mga kaimportansiya, ang emails ug ubang mga matang sa elektroniko nga mga sulat managsama ra gihapon ang kagamitan; magdugtong sila og mga tawo pinaagi sa pagbinaloay og kasayuran, mga pagbati, ug mga panghunahuna."

---
  title: "Ang Gasa sa Tagna"
  description: "Ang mga siyentipiko sa utok misugod sa pagsabut sa katingalahang katakus sa mga masuso sa pagkat-on og pinulongan. Sa unum ka bulan ang edad, ang bata makasabut og mga tingog nga nagsakop sa Ingles nga mga pulong, o sa mga pulong gikan sa bisan unsa sa ubang 7,000-kapin ka mga sinultihan. Kon kanunay makadungog og ikaduhang pinulongan, ilang mabatonan usab kana nga pinulongan. Niini nga panahon usa ka misteryoso nga utoknong pultahan maabli, nga magtugot sa mga masuso sa pagila sa mga 40 o kapin ka mga tingog nga sa kinatibuk-an maoy mahimong lumad nga pinulongan gikan sa mga 800 ka nagkalainlaing mga tingog nga ilang madunggan o masabtan panahon sa pagkahimugso. Apan adunay usa ka gamay nga hagit: ang masuso kinahanglan sultihan usab. Mahimong tawagon kini og leksyon sa paningog alang sa mga bag-ong nangatawo."

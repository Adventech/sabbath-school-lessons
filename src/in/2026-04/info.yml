---
  title: "Karunia Nubuat"
  description: "Para ahli saraf mulai memahami kemampuan luar biasa bayi manusia dalam pemerolehan bahasa. Pada usia enam bulan, bayi dapat memahami bunyi-bunyi yang membentuk kata-kata dalam bahasa Inggris, atau kata-kata dari lebih dari 7.000 bahasa lisan lainnya. Jika terpapar bahasa kedua, mereka juga dapat memperoleh bahasa tersebut. Selama periode ini, sebuah pintu mental misterius terbuka, memungkinkan bayi untuk membedakan sekitar empat puluh bunyi yang umumnya membentuk bahasa ibu dari 800 bunyi berbeda yang dapat mereka persepsikan saat lahir. Tetapi ada satu kendala: bayi harus diajak berbicara. Anda mungkin menyebutnya pelajaran vokal untuk bayi baru lahir."

---
  title: "Il dono della profezia"
  description: "I neuroscienziati hanno iniziato a comprendere l’incredibile capacità dei bambini di apprendere le lingue. All’età di sei mesi, i bambini possono comprendere i suoni che costituiscono qualsiasi delle più di settemila lingue parlate nel mondo. Se esposti a una seconda lingua, possono acquisire anche quella lingua. In questo periodo, si apre una misteriosa porta mentale che permette ai bambini di distinguere la quarantina di suoni che generalmente formano una lingua madre dagli ottocento suoni diversi che possono percepire alla nascita. Ma c’è una condizione: bisogna parlare ai neonati. Si potrebbero definire lezioni di voce per neonati."

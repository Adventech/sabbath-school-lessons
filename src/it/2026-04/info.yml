  description: "I neuroscienziati hanno iniziato a comprendere la straordinaria capacità dei neonati di acquisire il linguaggio. A soli sei mesi, un bambino è in grado di comprendere i suoni che compongono le parole della lingua italiana o di qualsiasi altra delle oltre settemila lingue parlate nel mondo. Se esposti a una seconda lingua, possono acquisire con tranquillità anche quella."

  title: "Isipho SeSiprofetho"
  description: "Ososayensi bemizwa nengqondo (neuroscientists) sebeqalile ukuqonda indlela emangalisayo yezingane yokufunda ulimi. Ezinyangeni eziyisithupha, ingane iqonda imisindo equkethe ulimi lwesiNgisi, noma amagama anoma yiluphi ulimi ezilimini ezevile ku-7,000 ezikhulunywayo. Uma kukhona olunye ulimi lwesibili ezibhekene nalo, zingalufunda nalo. Kulesisikhathi umnyango ofihlakele engqondweni uyavuleka, wenze izingane zikwazi ukwehlukanisa imisindo elinganiselwa ku-40 eyenza ulimi lwendabuko phakathi kwemisindo engu-800 eziyiqondayo ekuzalweni kwazo. Kodwa kunempica: izingane kumele kukhulunywe nazo. Ungakubiza ngezifundo zamazwi ezinganeni."

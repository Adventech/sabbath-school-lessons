  title: "예언의 선물"
  description: "신경과학자들은 갓난아기의 놀라운 언어 습득 능력을 이해하기 시작했 다. 아기는 생후 6개월이면 모국어를 포함해 전 세계 7천여 언어의 말소리 를 분간할 수 있다. 제2 언어를 접하면 그 언어도 습득한다. 이 시기의 유 아에게는 신비로운 정신의 문이 열려서 태어날 때 인식할 수 있는 800가 지 소리 가운데 모국어를 이루는 말소리 약 40가지를 식별해 낸다. 여기 서 한 가지 중요한 조건이 있다. 아이들에게 말을 걸어 주어야 한다는 것 이다. 말하자면 신생아를 위한 말소리 수업인 셈이다."

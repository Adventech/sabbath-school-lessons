---
  title: "Profetiens gave"
  description: "Neuroforskere er begyndt at dykke dybere ned i børns særlige evne til at tilegne sig sprog. Allerede ved 6 måneders alderen har barnet tilegnet sig de lyde, der kendetegner modersmålet, og eksponeres det for endnu et sprog, vil barnet også tilegne sig det. Indenfor en afgrænset periode er hjernen særlig modtagelig for netop disse lydindtryk, og barnet lærer således at skelne de omkring 40 lyde, der almindeligvis udgør et modersmål, fra de øvrige 800 lyde, som øret opfatter ved fødslen, forudsat altså at nogen taler med barnet."

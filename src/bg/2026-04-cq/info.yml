  title: "Дарът на пророчеството"
  description: "Невроучените започнаха да разбират невероятната способност на бебетата да учат език. На шестмесечна възраст бебето може да разбира звуците, които съставляват всеки от над седем хиляди говорими езика в света. Ако бъде изложено на втори език, то може да усвои и този език. През този период се отваря мистериозна умствена врата, която позволява на бебетата да различават около четиридесетте звуци, които обикновено съставляват роден език, от осемстотин различни звука, които могат да възприемат при раждането. Но има една уловка: на бебетата трябва да им се говори. Може да го наречете уроци по говор за новородени."

  title: "Дарът на пророчеството"
  description: "Невролозите започват да разбират невероятната способност на бебетата да възприемат езика. На 6 месеца бебето може да разбира звуци, които съставляват английските думи или думи от всеки друг от над 7000-те говорими езика. Ако им се говори на втори език, ще научат и него. През този период се отваря една тайнствена врата в ума, която позволява на бебетата да различават около 40-те звука, които по принцип съставляват един роден език, от 8000 различни звуци, които могат да възприемат след раждането. Но има една уловка: трябва да им се говори. Можете да го наречете гласови уроци за новородени."

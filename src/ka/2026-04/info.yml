  title: "წინასწარმეტყველების ნიჭი"
  description: "ნეირობიოლოგები მხოლოდ ახლა იწყებენ ჩვილი ბავშვების მიერ ენის ათვისების გასაოცარი უნარების წვდომას. უკვე ექვსი თვის ასაკში, ბავშვი ასხვავებს არა მხოლოდ მშობლიური, არამედ მსოფლიოს შვიდ ათასზე მეტი ენიდან ნებისმიერი სხვა ენის ბგერებსაც. თუ მის სიახლოვეს მეორე ენაც ისმის, პატარა მასაც აითვისებს. ამ პერიოდში ჩვილის ცნობიერებაში თითქოს საიდუმლო კარი იღება: რვაასი სხვადასხვა ბგერიდან, რომელთა აღქმაც მას დაბადებიდან შეუძლია, ბავშვი იწყებს ორმოცამდე ბგერის გამოყოფას – სწორედ იმ ბგერებისა, რომლებიც მისი მშობლიური ენის ბგერით საფუძველს ქმნის. თუმცა არსებობს ერთი პირობა: ჩვილს მუდმივად უნდა ელაპარაკოთ. ამას შეიძლება ახალშობილთათვის მეტყველების გაკვეთილებიც კი ვუწოდოთ."

---
  title: "Ti Sagut ti Padto"
  description: "Dagiti neuroscientists ket nangrugidan a maawatan ti nakaskasdaaw nga aruaten dagiti maladaga agpaay iti pananggun-od iti pagsasao. Iti innem a bulan, ti maysa a maladaga ket mabalinna a maawatan dagiti uni a buklen dagiti sasao nga Ingles, wenno sasao manipud iti aniaman kadagiti dadduma pay a nasurok a 7,000 a pagsasao. No makangngegda iti maikadua a pagsasao, mabalin met a magun-odda dayta a pagsasao. Kabayatan daytoy a panawen aglukat ti datdatlag a ruangan ti isip, a mangipalubos kadagiti maladaga a mangilasin iti 40 wenno nasursurok pay nga uni a gagangay a mangbukel iti nakairuaman a pagsasao manipud iti 800 a nagduduma nga uni a mangngegda iti pannakayanakda. Ngem adda maysa a banag a napateg: masapul a kasarita dagiti maladaga. Mabalin nga awagan dayta nga ad-adal ti timek agpaay kadagiti kayanak."
